name: Windows 2025 WSL2 Networking Issue Reproduction
on: [push, pull_request]
jobs:
  build:
    runs-on: windows-2025
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node repro.mjs
